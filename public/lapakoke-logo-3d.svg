<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Rings Gradients -->
    <linearGradient id="ringBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088FF" />
      <stop offset="50%" stop-color="#0055EE" />
      <stop offset="100%" stop-color="#003399" />
    </linearGradient>
    <linearGradient id="ringOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="40%" stop-color="#FF6600" />
      <stop offset="100%" stop-color="#E52200" />
    </linearGradient>

    <!-- Cart Gradients -->
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A2FF" />
      <stop offset="60%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0044CC" />
    </linearGradient>
    <linearGradient id="cartGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Speed Lines Gradient -->
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFCC00" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>

    <!-- Packages Gradients -->
    <linearGradient id="redBag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="70%" stop-color="#E51A24" />
      <stop offset="100%" stop-color="#99000A" />
    </linearGradient>
    <linearGradient id="yellowBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="60%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#FB8500" />
    </linearGradient>
    <linearGradient id="greenBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70E000" />
      <stop offset="60%" stop-color="#38B000" />
      <stop offset="100%" stop-color="#007200" />
    </linearGradient>

    <!-- 3D Text Gradients -->
    <linearGradient id="lapakBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="30%" stop-color="#0077B6" />
      <stop offset="85%" stop-color="#023E8A" />
      <stop offset="100%" stop-color="#001845" />
    </linearGradient>
    <linearGradient id="okeOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFBA08" />
      <stop offset="25%" stop-color="#FAA307" />
      <stop offset="70%" stop-color="#E85D04" />
      <stop offset="100%" stop-color="#9D0208" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow3D" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#001538" flood-opacity="0.35" />
    </filter>
    <filter id="glowCart" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0055EE" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 1. Outer Circular Ring Gradient (Orange & Blue) -->
  <g filter="url(#shadow3D)">
    <!-- Orange Crescent Lower Ring -->
    <path d="M 70 250 A 185 185 0 1 0 435 250 A 185 185 0 0 1 70 250" fill="none" stroke="url(#ringOrange)" stroke-width="26" stroke-linecap="round" />
    <!-- Blue Crescent Upper Ring -->
    <path d="M 68 245 A 185 185 0 0 1 432 230" fill="none" stroke="url(#ringBlue)" stroke-width="26" stroke-linecap="round" />
  </g>

  <!-- 2. Speed / Motion Lines behind Cart -->
  <g filter="url(#shadow3D)">
    <rect x="110" y="145" width="70" height="15" rx="7.5" fill="url(#speedGrad)" />
    <rect x="85" y="172" width="105" height="16" rx="8" fill="url(#speedGrad)" />
    <rect x="115" y="200" width="80" height="15" rx="7.5" fill="url(#speedGrad)" />
  </g>

  <!-- 3. Packages in Shopping Cart (3D parcels & bag) -->
  <g filter="url(#shadow3D)">
    <!-- Red Shopping Bag -->
    <rect x="210" y="70" width="85" height="100" rx="14" fill="url(#redBag)" />
    <path d="M 235 70 C 235 48, 270 48, 270 70" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    <!-- Bag gleam -->
    <path d="M 218 80 L 230 80 L 225 155 L 216 155 Z" fill="#FFFFFF" opacity="0.35" />

    <!-- Yellow / Orange Parcel -->
    <rect x="265" y="115" width="100" height="70" rx="10" transform="rotate(-6 315 150)" fill="url(#yellowBox)" />
    <line x1="315" y1="112" x2="315" y2="182" stroke="#FFFFFF" stroke-width="6" opacity="0.8" />
    <line x1="265" y1="147" x2="365" y2="147" stroke="#FFFFFF" stroke-width="6" opacity="0.8" />

    <!-- Green Box -->
    <rect x="325" y="100" width="65" height="85" rx="12" transform="rotate(12 355 140)" fill="url(#greenBox)" />
    <line x1="355" y1="98" x2="355" y2="185" stroke="#FFFFFF" stroke-width="5" opacity="0.75" />
  </g>

  <!-- 4. Glossy 3D Blue Shopping Cart -->
  <g filter="url(#glowCart)">
    <!-- Cart Body Outline (3D Thick Bar) -->
    <path d="M 125 105 L 175 105 L 220 205 L 380 205 L 410 140 L 230 140" 
          fill="none" stroke="url(#cartGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Inner Basket Fill Glassy -->
    <polygon points="215,150 395,150 375,200 230,200" fill="#00A2FF" opacity="0.5" />
    <!-- Cart Basket White Highlight Stripe -->
    <path d="M 228 195 L 368 195" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.9" />

    <!-- Cart Wheels (3D Blue & White Hub) -->
    <circle cx="240" cy="245" r="19" fill="#003399" />
    <circle cx="240" cy="245" r="14" fill="#0077EE" />
    <circle cx="240" cy="245" r="5" fill="#FFFFFF" />

    <circle cx="345" cy="245" r="19" fill="#003399" />
    <circle cx="345" cy="245" r="14" fill="#0077EE" />
    <circle cx="345" cy="245" r="5" fill="#FFFFFF" />
  </g>

  <!-- 5. 3D Typographic Brand Name: "LapakOke" -->
  <g filter="url(#shadow3D)">
    <!-- Text Base White Border for High Contrast Pop -->
    <text x="25" y="365" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="94" letter-spacing="-2"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round">Lapak</text>
    <text x="268" y="365" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="94" letter-spacing="-2"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round">Oke</text>

    <!-- 3D Shadow Layer for "Lapak" -->
    <text x="25" y="370" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="94" letter-spacing="-2"
          fill="#001845">Lapak</text>
    <!-- Foreground Gradient for "Lapak" -->
    <text x="25" y="365" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="94" letter-spacing="-2"
          fill="url(#lapakBlue)">Lapak</text>

    <!-- 3D Shadow Layer for "Oke" -->
    <text x="268" y="370" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="94" letter-spacing="-2"
          fill="#6A040F">Oke</text>
    <!-- Foreground Gradient for "Oke" -->
    <text x="268" y="365" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="94" letter-spacing="-2"
          fill="url(#okeOrange)">Oke</text>

    <!-- Glossy Highlight Sweeps on Letters -->
    <path d="M 40 300 Q 55 285 75 300" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 290 315 Q 315 295 340 315" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>

  <!-- 6. Friendly Smile Underline Curve -->
  <path d="M 160 375 Q 260 415 315 375" fill="none" stroke="#FF7700" stroke-width="12" stroke-linecap="round" filter="url(#shadow3D)" />
  <path d="M 165 375 Q 260 410 310 375" fill="none" stroke="#FFAA00" stroke-width="6" stroke-linecap="round" />

  <!-- 7. Vibrant ".com" Badge -->
  <g filter="url(#shadow3D)">
    <rect x="290" y="380" width="180" height="52" rx="26" fill="#FFFFFF" />
    <rect x="294" y="384" width="172" height="44" rx="22" fill="url(#cartGrad)" />
    <!-- .com text -->
    <text x="380" y="416" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="1"
          fill="#FFFFFF" text-anchor="middle">.com</text>
  </g>
</svg>
