<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Top Arc for 'KUICK MART' -->
    <path id="topArc" d="M 78 256 A 178 178 0 0 1 434 256" fill="none" />
    <!-- Bottom Arc for 'PANGANDARAN' (tops of letters face inward towards center) -->
    <path id="bottomArc" d="M 66 256 A 190 190 0 0 0 446 256" fill="none" />
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" fill="#ffffff" rx="40" />

  <!-- Circular Outer Red Ring with Black Border -->
  <circle cx="256" cy="256" r="242" fill="#E51A24" stroke="#000000" stroke-width="6" />

  <!-- Inner White Circle with Black Border -->
  <circle cx="256" cy="256" r="166" fill="#ffffff" stroke="#000000" stroke-width="6" />

  <!-- Top Curved Text: KUICK MART -->
  <text fill="#ffffff" font-family="'Arial Black', 'Impact', 'DejaVu Sans', 'Liberation Sans', sans-serif" font-weight="900" font-size="43" letter-spacing="3.5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">KUICK MART</textPath>
  </text>

  <!-- Bottom Curved Text: PANGANDARAN -->
  <text fill="#ffffff" font-family="'Arial Black', 'Impact', 'DejaVu Sans', 'Liberation Sans', sans-serif" font-weight="900" font-size="35" letter-spacing="3.5">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">PANGANDARAN</textPath>
  </text>

  <!-- Center Graphic: Speed lines and Stylized K -->
  <g id="centerSymbol">
    <!-- 5 Horizontal Red Speed Lines (left aligned at x=146) -->
    <!-- Line 1 (Top) -->
    <polygon points="146,174 233,174 231,183 146,183" fill="#E51A24" />
    <!-- Line 2 -->
    <polygon points="146,211 224,211 222,220 146,220" fill="#E51A24" />
    <!-- Line 3 -->
    <polygon points="146,248 215,248 213,257 146,257" fill="#E51A24" />
    <!-- Line 4 -->
    <polygon points="146,285 206,285 204,294 146,294" fill="#E51A24" />
    <!-- Line 5 (Bottom) -->
    <polygon points="146,322 197,322 195,331 146,331" fill="#E51A24" />

    <!-- Red Slanted Vertical Stem of K -->
    <polygon points="230,170 266,170 228,335 192,335" fill="#E51A24" stroke="#000000" stroke-width="2.5" stroke-linejoin="miter" />

    <!-- Black Diagonal Chevron Arms of K -->
    <!-- Upper Arm -->
    <polygon points="242,260 326,170 365,170 274,272" fill="#000000" stroke="#000000" stroke-width="1.5" stroke-linejoin="miter" />
    <!-- Lower Arm -->
    <polygon points="264,260 286,288 328,335 289,335 242,275" fill="#000000" stroke="#000000" stroke-width="1.5" stroke-linejoin="miter" />
  </g>
</svg>