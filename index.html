    <!-- Cross-Browser Service Worker Auto-Recovery for Firefox & Mobile -->
    <script>
      (function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'RELOAD_PAGE') {
              window.location.reload();
            }
          });
        }
      })();
    </script>

    <!-- Suppress Vite HMR WebSocket connection errors in AI Studio proxy environment -->
    <script>
      (function() {
        window.addEventListener('error', function(event) {
          if (event && (
            (event.message && (event.message.indexOf('WebSocket') !== -1 || event.message.indexOf('createWebSocketModuleRunnerTransport') !== -1 || event.message.indexOf('@vite/client') !== -1)) ||
            (event.filename && event.filename.indexOf('@vite/client') !== -1)
          )) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            var reasonStr = String(event.reason);
            if (reasonStr.indexOf('WebSocket') !== -1 || reasonStr.indexOf('createWebSocketModuleRunnerTransport') !== -1 || reasonStr.indexOf('@vite/client') !== -1) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          }
        }, true);
      })();
    </script>

    <script>
      (function() {
        try {
          var urlParams = new URLSearchParams(window.location.search);
          var paramStore = urlParams.get('store');
          var host = window.location.hostname || '';
          var slug = 'default';
          if (paramStore && paramStore.trim()) {
            slug = paramStore.trim().toLowerCase();
          } else if (host.endsWith('.toko-online.online') && host !== 'www.toko-online.online') {
            slug = host.replace('.toko-online.online', '').toLowerCase();
          }

          var cachedFavicon = localStorage.getItem('app_active_favicon_href_' + slug) ||
                              localStorage.getItem('app_active_favicon_href') ||
                              '/logo.png';

          var links = document.querySelectorAll("link[rel*='icon'], link[rel='apple-touch-icon']");
          links.forEach(function(l) { l.href = cachedFavicon; });

          var cachedBrand = localStorage.getItem('toko_online_brand_config_' + slug) ||
                            (slug === 'default' ? localStorage.getItem('toko_online_brand_config') : null);
          if (cachedBrand) {
            var b = JSON.parse(cachedBrand);
            if (b && b.brandNamePart1) {
              var fullTitle = (b.brandNamePart1 + ' ' + (b.brandNamePart2 || '')).trim();
              document.title = fullTitle + ' - Belanja & Kasir Online';
            }
          }
        } catch(e) {}
      })();
    </script>
